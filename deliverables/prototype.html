<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench Tag demo</title>
<meta name="description" content="Interactive demo of Bench Tag: job tracking for reel service techs, rod repairers and custom rod builders. Storm Proof Tackle, Virginia Beach, VA. All data is made up.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
/* Layout concept: a workshop board. Dense job lists on desktop with a left rail; one-column cards
   and a bottom tab bar on the phone. The product's own pages (public page, status page) render
   inside the demo chrome exactly as the angler sees them. One accent (anodized-spool blue), a
   manila hang-tag for the mark, status colours as tokens that never stand alone without a label. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --surface-3:#dde3ea;
  --fg:#172029; --fg-2:#46545f; --fg-3:#6f7d89;
  --line:#d6dde4; --line-strong:#b7c1cb;
  --accent:#20608f; --accent-hover:#184d75; --accent-fg:#ffffff; --accent-soft:#e2edf7; --ring:rgba(32,96,143,.35);
  --tag:#efd9a0; --tag-fg:#4f3f12; --tag-line:#c9ad62;
  --ok:#1b7a4a; --warn:#9a5b00; --bad:#b3252f;
  --st-requested:#5e6f80; --st-received:#20608f; --st-diagnosing:#5b53c7; --st-quote_sent:#9a5b00;
  --st-approved:#0e7c6b; --st-declined:#b3252f; --st-in_progress:#20608f; --st-waiting_parts:#c2410c;
  --st-finishing:#7b3fd6; --st-ready:#1b7a4a; --st-closed:#64748b; --st-cancelled:#8a8f96;
  --shadow:0 1px 2px rgba(23,32,41,.05),0 6px 18px rgba(23,32,41,.06);
  --sheet-shadow:0 -8px 30px rgba(23,32,41,.18);
  --r:10px; --r-s:6px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --topbar:52px; --tabbar:60px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161e26; --surface-2:#1e2832; --surface-3:#28343f;
  --fg:#e7edf3; --fg-2:#aab7c3; --fg-3:#7f8d9a;
  --line:#28343f; --line-strong:#3b4956;
  --accent:#6fb1e3; --accent-hover:#8cc2ec; --accent-fg:#0a1a28; --accent-soft:#17304a; --ring:rgba(111,177,227,.45);
  --tag:#7d6a3b; --tag-fg:#f6ead0; --tag-line:#a68f58;
  --ok:#4cc38a; --warn:#e3a44a; --bad:#f07178;
  --st-requested:#9bacbd; --st-received:#6fb1e3; --st-diagnosing:#a89ff2; --st-quote_sent:#e3a44a;
  --st-approved:#4fd1c0; --st-declined:#f07178; --st-in_progress:#6fb1e3; --st-waiting_parts:#f5915c;
  --st-finishing:#b58cf5; --st-ready:#4cc38a; --st-closed:#94a3b8; --st-cancelled:#9aa1a9;
  --shadow:0 1px 2px rgba(0,0,0,.3); --sheet-shadow:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161e26; --surface-2:#1e2832; --surface-3:#28343f;
  --fg:#e7edf3; --fg-2:#aab7c3; --fg-3:#7f8d9a;
  --line:#28343f; --line-strong:#3b4956;
  --accent:#6fb1e3; --accent-hover:#8cc2ec; --accent-fg:#0a1a28; --accent-soft:#17304a; --ring:rgba(111,177,227,.45);
  --tag:#7d6a3b; --tag-fg:#f6ead0; --tag-line:#a68f58;
  --ok:#4cc38a; --warn:#e3a44a; --bad:#f07178;
  --st-requested:#9bacbd; --st-received:#6fb1e3; --st-diagnosing:#a89ff2; --st-quote_sent:#e3a44a;
  --st-approved:#4fd1c0; --st-declined:#f07178; --st-in_progress:#6fb1e3; --st-waiting_parts:#f5915c;
  --st-finishing:#b58cf5; --st-ready:#4cc38a; --st-closed:#94a3b8; --st-cancelled:#9aa1a9;
  --shadow:0 1px 2px rgba(0,0,0,.3); --sheet-shadow:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);overflow-x:hidden}
img,svg{max-width:100%}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:650}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1rem} h4{font-size:.9rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:var(--r-s)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.actionbar .btn{min-width:0;white-space:normal;line-height:1.2}
.actionbar .btn.primary{flex:2 1 auto}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);color:var(--fg);padding:10px 14px;border-radius:var(--r-s);z-index:200;box-shadow:var(--shadow)}
.skip:focus{top:8px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.small{font-size:.86rem} .tiny{font-size:.78rem}
.strong{font-weight:650}
.upper{text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;font-weight:650;color:var(--fg-3)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.row.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.stack{display:grid;gap:12px;min-width:0}
.stack-s{display:grid;gap:6px;min-width:0}
.grow{flex:1 1 auto;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right}
.center{text-align:center}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.lg{width:24px;height:24px}

/* ---------- demo chrome ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--topbar);display:flex;align-items:center;gap:10px;
  padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;text-decoration:none;color:var(--fg);min-height:44px}
.brand .mark{width:26px;height:26px}
.brand .demo{font-size:.7rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--tag-fg);background:var(--tag);border-radius:4px;padding:2px 6px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--fg-2);padding:0 12px;min-height:34px;border-radius:999px;font-weight:600;font-size:.86rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.topbar .spacer{flex:1}
.topbar .tools{display:flex;gap:6px;align-items:center}
@media (max-width:599px){ .topbar .seg button{padding:0 9px;font-size:.8rem} .brand span.name{display:none} .topbar .hide-phone{display:none} }

.shell{display:flex;min-height:calc(100vh - var(--topbar))}
.rail{display:none}
main{flex:1;min-width:0}
.page{max-width:1080px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:18px 32px}
.page.narrow{max-width:720px}
.page.wide{max-width:1180px}
body.has-tabbar .page{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 24px)}
body.has-tabbar.has-actionbar .page{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 96px)}
@media (min-width:900px){
  .rail{display:flex;flex-direction:column;width:216px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;gap:2px;position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));align-self:flex-start}
  .rail a{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:40px;border-radius:8px;color:var(--fg-2);text-decoration:none;font-weight:600;font-size:.92rem}
  .rail a:hover{background:var(--surface-2);color:var(--fg)}
  .rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail .rail-foot{margin-top:auto;padding:10px 12px;color:var(--fg-3);font-size:.78rem;line-height:1.4}
  .rail .rail-sec{padding:14px 12px 4px}
}
.tabbar{display:none}
@media (max-width:899px){
  body.has-tabbar .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabbar);border:0;background:none;color:var(--fg-3);text-decoration:none;font-size:.68rem;font-weight:600}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar .new{color:var(--accent)}
  .tabbar .new .ic{width:28px;height:28px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:5px}
}

/* ---------- tour ---------- */
.tour{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.tour .in{max-width:1080px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px;display:grid;gap:8px}
.tour .steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tour .steps::-webkit-scrollbar{display:none}
.tour .steps button{flex:none;border:1px solid transparent;background:transparent;color:var(--fg-2);border-radius:999px;padding:0 10px;min-height:32px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
.tour .steps button .n{width:20px;height:20px;border-radius:999px;background:var(--surface);display:inline-grid;place-items:center;font-size:.72rem;color:var(--fg)}
.tour .steps button[aria-current="step"]{background:var(--surface);color:var(--fg);border-color:var(--line)}
.tour .steps button[aria-current="step"] .n,.tour .steps button.done .n{background:var(--accent);color:var(--accent-fg)}
.tour .body{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tour .body .t{flex:1 1 320px;min-width:0}
.tour .body h3{font-size:.98rem}
.tour .x{margin-left:auto}
.hl{outline:3px solid var(--warn);outline-offset:4px;border-radius:var(--r);animation:hl 1.2s ease-in-out 3}
@keyframes hl{0%,100%{outline-color:var(--warn)}50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){ .hl{animation:none} *{transition:none!important;scroll-behavior:auto!important} }

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:.86rem}
.btn.xs{min-height:32px;padding:0 10px;font-size:.8rem}
.btn.big{min-height:52px;font-size:1.05rem;padding:0 22px}
.btn.block{width:100%}
.btn.wrap{white-space:normal;text-align:left}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.icon{padding:0;width:44px}
.btn.icon.sm{width:36px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;min-height:44px;display:inline-flex;align-items:center}
.field{display:grid;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:.84rem;font-weight:650;color:var(--fg-2)}
.field .hint{font-size:.78rem;color:var(--fg-3)}
.field .err{font-size:.8rem;color:var(--bad);font-weight:600}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);color:var(--fg)}
textarea{min-height:88px;resize:vertical;line-height:1.4}
input::placeholder,textarea::placeholder{color:var(--fg-3)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.radios{display:grid;gap:6px}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);cursor:pointer}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.kindtog{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden}
.kindtog label{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;cursor:pointer;font-weight:650;color:var(--fg-2);background:var(--surface)}
.kindtog label:has(input:checked){background:var(--accent);color:var(--accent-fg)}
.kindtog input{position:absolute;opacity:0;width:0;height:0}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .trk{width:44px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+.trk{background:var(--accent)}
.switch input:checked+.trk::after{transform:translateX(18px)}
.switch input:focus-visible+.trk{outline:3px solid var(--ring);outline-offset:2px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel.pad-0{padding:0;overflow:hidden}
.panel h2,.panel h3{margin-bottom:2px}
.panel>.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel>.head h2,.panel>.head h3{margin:0}
.divider{height:1px;background:var(--line);margin:4px 0}
.notice{border-radius:var(--r-s);padding:10px 12px;font-size:.9rem;border:1px solid var(--line);background:var(--surface-2)}
.notice.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.notice.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;text-decoration:none;color:inherit}
.kpi .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:.8rem;color:var(--fg-2);font-weight:600}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}
.empty{padding:22px 14px;text-align:center;color:var(--fg-2);border:1px dashed var(--line-strong);border-radius:var(--r);font-size:.92rem}

/* status chip: colour + label, never colour alone */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:650;white-space:nowrap;line-height:1.5;
  --st:var(--st-requested);color:var(--st);background:color-mix(in srgb,var(--st) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--st) 35%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--st);flex:none}
.chip.lg{font-size:.9rem;padding:4px 12px}
.st-requested{--st:var(--st-requested)} .st-received{--st:var(--st-received)} .st-diagnosing{--st:var(--st-diagnosing)}
.st-quote_sent{--st:var(--st-quote_sent)} .st-approved{--st:var(--st-approved)} .st-declined{--st:var(--st-declined)}
.st-in_progress{--st:var(--st-in_progress)} .st-waiting_parts{--st:var(--st-waiting_parts)} .st-finishing{--st:var(--st-finishing)}
.st-ready{--st:var(--st-ready)} .st-closed{--st:var(--st-closed)} .st-cancelled{--st:var(--st-cancelled)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:5px;font-size:.74rem;font-weight:650;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line);white-space:nowrap}
.badge.kind{text-transform:uppercase;letter-spacing:.05em;font-size:.68rem}
.badge.paid{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.badge.owing{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.badge.late{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.badge.src{font-weight:600}
.code{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:.04em;background:var(--tag);color:var(--tag-fg);border:1px solid var(--tag-line);border-radius:5px;padding:1px 7px;white-space:nowrap}
.code.lg{font-size:1.5rem;padding:6px 14px;border-radius:8px;letter-spacing:.08em}
.late{color:var(--bad);font-weight:650}
.due-soon{color:var(--warn);font-weight:650}

/* job lists */
.jobs{display:grid;gap:8px}
.job{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;min-width:0}
.job:hover{border-color:var(--line-strong);background:var(--surface)}
.job .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.job .num{font-family:var(--mono);color:var(--fg-3);font-size:.82rem}
.job .item{font-weight:650;min-width:0}
.job .l2{color:var(--fg-2);font-size:.86rem;display:flex;gap:6px 10px;flex-wrap:wrap;min-width:0}
.job .date{grid-column:2;grid-row:1/3;text-align:right;font-size:.84rem;color:var(--fg-2);white-space:nowrap;display:grid;gap:2px;justify-items:end}
.job .date b{font-weight:650;color:var(--fg)}
@media (min-width:900px){
  .jobs.table .job{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 150px;align-items:center;padding:10px 14px;border-radius:0;border-width:0 0 1px}
  .jobs.table{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;gap:0}
  .jobs.table .job:last-child{border-bottom:0}
  .jobs.table .job .l1{grid-column:1;grid-row:1}.jobs.table .job .l2{grid-column:2;grid-row:1}
  .jobs.table .job .date{grid-column:3;grid-row:1}
}
.only-phone{display:none}
@media (max-width:599px){ .only-phone{display:inline} }
@media (max-width:399px){ .brand .demo{display:none} }
main:focus{outline:none}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:999px;animation:spin .8s linear infinite;vertical-align:-4px}
.pub-ctas .btn{flex:1 1 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;min-height:36px;padding:0 12px;font-size:.84rem;font-weight:600;color:var(--fg-2);display:inline-flex;gap:6px;align-items:center}
.chips button .c{background:var(--surface-2);border-radius:999px;padding:0 7px;font-size:.74rem;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button[aria-pressed="true"] .c{background:rgba(255,255,255,.2);color:inherit}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.search input{padding-left:38px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);font-weight:650;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lines{display:grid;gap:6px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;font-size:.92rem}
.line .d{min-width:0}
.line .sub{color:var(--fg-3);font-size:.8rem}
.line .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.line.total{border-top:1px solid var(--line-strong);padding-top:8px;margin-top:4px;font-weight:700;font-size:1.02rem}
.line.neg .amt{color:var(--ok)}
.line .amt.pend{color:var(--fg-3)}

/* timeline */
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 0;position:relative;min-width:0}
.tl li::before{content:"";position:absolute;left:10px;top:28px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line);margin-top:1px}
.tl .dot .ic{width:13px;height:13px}
.tl .dot.st{background:color-mix(in srgb,var(--st) 15%,var(--surface));color:var(--st);border-color:color-mix(in srgb,var(--st) 40%,transparent)}
.tl .dot.mail{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tl .dot.pay{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok);border-color:transparent}
.tl .t{font-size:.9rem;min-width:0}
.tl .t .when{color:var(--fg-3);font-size:.78rem}
.tl .t .sub{color:var(--fg-2);font-size:.84rem}
.tl .t .subj{font-style:italic}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo{display:grid;gap:6px;min-width:0}
.photo .img{aspect-ratio:4/3;max-width:100%;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:rgba(255,255,255,.85);position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--fg) 70%,var(--p,#4a6a8a)),color-mix(in srgb,var(--fg) 40%,var(--p,#4a6a8a)))}
.photo .img .ic{width:36px;height:36px;opacity:.9}
.photo .img .k{position:absolute;left:6px;top:6px;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;background:rgba(0,0,0,.45);color:#fff;border-radius:4px;padding:1px 5px}
.photo .cap{font-size:.8rem;color:var(--fg-2)}
.photo .vis{font-size:.78rem}

/* sheets & dialogs */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(10,16,22,.5)}
.sheet{width:min(100vw,560px);margin:auto;background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:var(--sheet-shadow);padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line)}
@media (max-width:599px){
  .sheet{position:fixed;left:0;right:0;bottom:0;width:100vw;margin:0;border-radius:16px 16px 0 0;max-height:88vh;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:-6px auto 12px}
}
.sheet .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.sheet .actions .btn{flex:1 1 auto}
.choice-list{display:grid;gap:8px}
.choice-list .btn{justify-content:flex-start;min-height:48px;text-align:left;white-space:normal}
.choice-list .btn .ch{display:grid;gap:1px}
.choice-list .btn .ch small{font-weight:500;color:var(--fg-3)}
.checkout{width:min(100vw,620px)}
.checkout .demo-banner{background:var(--tag);color:var(--tag-fg);border-radius:8px;padding:8px 12px;font-weight:650;font-size:.86rem;display:flex;gap:8px;align-items:center}
.checkout .card{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface-2)}
.checkout .stripe{font-weight:800;font-style:italic;color:#635bff;letter-spacing:-.02em}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
body.has-tabbar .toasts{bottom:calc(var(--tabbar) + 12px + env(safe-area-inset-bottom,0px))}
.toast{background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow);pointer-events:auto}
.toast.ok{background:var(--ok);color:#fff}

/* action bar (phone) */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter-r) 10px var(--gutter-l);display:flex;gap:8px}
.actionbar .btn{flex:1}
@media (min-width:900px){ .actionbar{position:static;border:0;padding:0;background:none} }

/* job detail */
.jobhead{display:grid;gap:10px}
.jobhead .title{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.jobhead h1{font-size:1.35rem}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 14px}
.meta div{display:grid;gap:1px;min-width:0}
.meta .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);font-weight:650}
.meta .v{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cols{display:grid;gap:14px}
@media (min-width:1000px){ .cols{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start} }

/* status page (customer) */
.status-page{max-width:560px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:16px 40px;display:grid;gap:14px}
.shopline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--fg-2)}
.shopline b{color:var(--fg)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px;border-top:5px solid var(--st,var(--accent))}
.hero .status{font-size:1.5rem;font-weight:750;line-height:1.15;letter-spacing:-.01em}
.hero .item{font-size:1rem;color:var(--fg-2);font-weight:600}
.hero .promise{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hero .promise .d{font-size:1.1rem;font-weight:700}
.contact{display:grid;gap:6px;font-size:.9rem}
.contact .row{justify-content:space-between}
.powered{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--fg-3);font-size:.8rem;padding:10px}
.powered a{color:inherit;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;gap:5px}

/* public page */
.pub{max-width:760px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:18px 40px;display:grid;gap:18px}
.pub-head{display:grid;gap:10px}
.pub-head h1{font-size:1.9rem;letter-spacing:-.015em}
.pub-head .sub{color:var(--fg-2);font-size:1.02rem;max-width:60ch}
.pub-ctas{display:flex;gap:10px;flex-wrap:wrap}
.svc-group{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.svc-group h3{padding:10px 14px;background:var(--surface-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.svc{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.svc .n{font-weight:650}
.svc .d{color:var(--fg-2);font-size:.86rem;grid-column:1}
.svc .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.svc .t{grid-column:2;color:var(--fg-3);font-size:.78rem;text-align:right;white-space:nowrap}
.closed-banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.closed-banner .ic{color:var(--warn);margin-top:2px}
.turnstile{display:flex;align-items:center;gap:12px;border:1px solid var(--line-strong);border-radius:6px;padding:10px 12px;background:var(--surface-2);max-width:320px;min-height:64px}
.turnstile .box{width:26px;height:26px;border:2px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;background:var(--surface);flex:none}
.turnstile.ok .box{border-color:var(--ok);color:var(--ok)}
.turnstile .lbl{font-size:.9rem;font-weight:600}
.turnstile .cf{margin-left:auto;font-size:.66rem;color:var(--fg-3);text-align:right;line-height:1.2}
.turnstile .spin{width:18px;height:18px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:999px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* landing */
.land{max-width:960px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:36px 60px;display:grid;gap:40px}
.land .hero-l{display:grid;gap:18px;max-width:700px}
.land h1{font-size:clamp(1.9rem,4.5vw,2.8rem);letter-spacing:-.02em;line-height:1.08}
.land .lede{font-size:1.1rem;color:var(--fg-2);max-width:58ch}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.step .n{width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.price{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.price .big{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.price .big small{font-size:1rem;font-weight:600;color:var(--fg-2);letter-spacing:0}
.price ul{margin:0;padding-left:18px;color:var(--fg-2);display:grid;gap:4px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.quote{background:var(--surface-2);border-radius:var(--r);padding:16px;display:grid;gap:10px;border-left:4px solid var(--tag-line)}
.quote p{font-size:.98rem;line-height:1.45}
.quote cite{font-style:normal;font-size:.8rem;color:var(--fg-3)}

/* billing */
.meter{display:grid;gap:8px}
.meter .bar{height:14px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}
.meter .bar span{display:block;height:100%}
.meter .bar .fee{background:var(--ok)}
.meter .bar .ledger{background:var(--accent)}
.meter .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--fg-2)}
.meter .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.meter .legend .fee i{background:var(--ok)} .meter .legend .ledger i{background:var(--accent)}

/* receipt / QR */
.receipt{border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px;display:grid;gap:12px;background:var(--surface)}
.qr{width:112px;height:112px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;flex:none}
.qr svg{width:100%;height:100%;shape-rendering:crispEdges}
.phone-frame{border:1px solid var(--line-strong);border-radius:22px;padding:10px;background:var(--surface-2);max-width:420px}
.phone-frame .scr{border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line);max-height:620px;overflow-y:auto}
.phone-frame .scr .pub{padding-block:12px 20px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>

<header class="topbar" id="topbar"></header>
<div id="tour"></div>

<script>
'use strict';
/* ===================================================================================
   Bench Tag demo. One in-memory state object (S), a hash router, template-literal views.
   Nothing here talks to a server. Stripe Checkout, Turnstile and email are mocked.
   =================================================================================== */

// ---------- demo clock: the demo is frozen on Wed 2026-10-21; actions happen "now" ----------
const DEMO_EPOCH = new Date('2026-10-21T10:30:00').getTime();
const LOAD_AT = Date.now();
const now = () => new Date(DEMO_EPOCH + (Date.now() - LOAD_AT));
const iso = (d) => new Date(d).toISOString();
const todayStr = () => ymd(now());
function ymd(d){ d = new Date(d); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function at(dateStr, hm='10:00'){ return iso(new Date(`${dateStr}T${hm}:00`)); }
function addDays(dateStr, n){ const d = new Date(`${dateStr}T12:00:00`); d.setDate(d.getDate()+n); return ymd(d); }
function daysBetween(a, b){ return Math.round((new Date(`${b}T12:00:00`) - new Date(`${a}T12:00:00`)) / 86400000); }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(s, opts={}){ if(!s) return '—'; const d = s.length === 10 ? new Date(`${s}T12:00:00`) : new Date(s);
  const y = d.getFullYear() !== now().getFullYear() || opts.year ? `, ${d.getFullYear()}` : '';
  return `${opts.dow ? DOWS[d.getDay()]+' ' : ''}${MONTHS[d.getMonth()]} ${d.getDate()}${y}`; }
function fmtDT(s){ const d = new Date(s); let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0'); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${fmtDate(s)}, ${h}:${m} ${ap}`; }
function fmtMonth(ym){ const [y,m] = ym.split('-'); return `${['January','February','March','April','May','June','July','August','September','October','November','December'][+m-1]} ${y}`; }
function relDays(dateStr){ const n = daysBetween(todayStr(), dateStr);
  if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return '1 day late';
  if (n < 0) return `${-n} days late`; return `in ${n} days`; }
const money = (c) => (c < 0 ? '−' : '') + '$' + (Math.abs(c)/100).toFixed(2);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const CODE_ALPHABET = 'ACDEFGHJKLMNPQRTUVWXY34679'; // no I/O/0/1/B/8/S/5/Z/2
function randomToken(){ const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'; let t=''; for(let i=0;i<22;i++) t += a[Math.floor(Math.random()*a.length)]; return t; }
function shortCode(){ let c=''; for(let i=0;i<4;i++) c += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)]; return `${S.shop.codePrefix}-${c}`; }
const normCode = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const normPhone = s => String(s||'').replace(/\D/g,'');
const icon = (n, cls='') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

// ---------- domain: statuses, labels, transitions (product definition §5d) ----------
const STATUSES = ['requested','received','diagnosing','quote_sent','approved','declined','in_progress','waiting_parts','finishing','ready','closed','cancelled'];
const OPEN = STATUSES.filter(s => s !== 'closed' && s !== 'cancelled');
const LABELS = {
  requested:    { reel:['Requested','Request received'],            rod:['Order placed','Waiting for your deposit'] },
  received:     { reel:['Received','We have your reel'],            rod:['Order confirmed','Your order is confirmed'] },
  diagnosing:   { reel:['Diagnosing','Being looked at'],            rod:null },
  quote_sent:   { reel:['Quote sent','Waiting for your approval'],  rod:['Change quoted','Waiting for your approval'] },
  approved:     { reel:['Approved','Approved, in the queue'],       rod:['Approved','Approved, in the queue'] },
  declined:     { reel:['Declined','You declined the quote'],       rod:['Declined','You declined the quote'] },
  in_progress:  { reel:['On the bench','Being serviced'],           rod:['Building','Being built'] },
  waiting_parts:{ reel:['Waiting for parts','Waiting for parts'],   rod:['Components ordered','Blank and components ordered'] },
  finishing:    { reel:['Final assembly and test','Almost done'],   rod:['Wrapping and finishing','Wrapping and finishing'] },
  ready:        { reel:['Ready','Ready for pickup'],                rod:['Ready','Ready for pickup'] },
  closed:       { reel:['Closed','Closed'],                         rod:['Closed','Closed'] },
  cancelled:    { reel:['Cancelled','Cancelled'],                   rod:['Cancelled','Cancelled'] },
};
function shopLabel(job, st=job.status){ const l = LABELS[st][job.kind] || LABELS[st].reel; return l[0]; }
function custLabel(job, st=job.status){
  if (st === 'ready') return job.delivery === 'ship' ? 'Ready to ship' : 'Ready for pickup';
  if (st === 'closed') return ({picked_up:'Picked up', shipped:'Shipped', returned_unrepaired:'Returned', abandoned:'Closed', other:'Closed'})[job.closedHow] || 'Closed';
  const l = LABELS[st][job.kind] || LABELS[st].reel; return l[1];
}
const TRANSITIONS = {
  requested:     { reel:['received','cancelled'], rod:['received','cancelled'] },
  received:      { reel:['diagnosing','quote_sent','in_progress','waiting_parts','ready','cancelled'], rod:['quote_sent','in_progress','waiting_parts','ready','cancelled'] },
  diagnosing:    { reel:['quote_sent','in_progress','waiting_parts','ready','cancelled'], rod:[] },
  quote_sent:    { reel:['approved','declined','quote_sent','cancelled'], rod:['approved','declined','quote_sent','cancelled'] },
  approved:      { reel:['in_progress','waiting_parts'], rod:['in_progress','waiting_parts'] },
  declined:      { reel:['ready','cancelled'], rod:['ready','cancelled'] },
  in_progress:   { reel:['waiting_parts','finishing','ready','quote_sent'], rod:['waiting_parts','finishing','ready','quote_sent'] },
  waiting_parts: { reel:['in_progress','finishing','quote_sent'], rod:['in_progress','finishing','quote_sent'] },
  finishing:     { reel:['ready','in_progress'], rod:['ready','in_progress'] },
  ready:         { reel:['closed','in_progress'], rod:['closed','in_progress'] },
  closed: { reel:[], rod:[] }, cancelled: { reel:[], rod:[] },
};
const allowed = (job) => TRANSITIONS[job.status][job.kind] || [];
// The big button: the default next step for this kind; everything else sits behind "Other".
function nextStep(job){
  const k = job.kind, s = job.status;
  const map = {
    requested:     k === 'rod' ? ['received','Confirm order'] : ['received','Mark received'],
    received:      k === 'rod' ? ['waiting_parts','Order blank and components'] : ['diagnosing','Start diagnosing'],
    diagnosing:    ['quote_sent','Send a quote'],
    quote_sent:    ['approved','Record approval'],
    approved:      ['in_progress', k === 'rod' ? 'Start building' : 'Start work'],
    in_progress:   k === 'rod' ? ['finishing','Start finishing'] : ['ready','Mark ready'],
    waiting_parts: ['in_progress', k === 'rod' ? 'Parts in, start building' : 'Parts in, back on the bench'],
    finishing:     ['ready','Mark ready'],
    declined:      ['ready','Ready to return unrepaired'],
    ready:         ['closed','Close job'],
  }[s];
  if (!map) return null;
  return { to: map[0], label: map[1] };
}
const OTHER_LABELS = {
  received:'Mark received', diagnosing:'Start diagnosing', quote_sent:'Send a quote', approved:'Record approval on behalf',
  declined:'Record a decline on behalf', in_progress:'On the bench', waiting_parts:'Waiting for parts', finishing:'Final assembly and test',
  ready:'Mark ready', closed:'Close job', cancelled:'Cancel job',
};
function otherLabel(job, to){
  if (to === 'in_progress') return job.kind === 'rod' ? 'Building' : 'On the bench';
  if (to === 'waiting_parts') return job.kind === 'rod' ? 'Components ordered' : 'Waiting for parts';
  if (to === 'finishing') return job.kind === 'rod' ? 'Wrapping and finishing' : 'Final assembly and test';
  if (to === 'quote_sent' && job.status === 'quote_sent') return 'Revise the quote';
  if (to === 'quote_sent' && (job.status === 'in_progress' || job.status === 'waiting_parts')) return 'Found more work, send a quote';
  if (to === 'ready' && job.status === 'declined') return 'Ready to return unrepaired';
  if (to === 'in_progress' && job.status === 'ready') return 'Rework before it leaves';
  return OTHER_LABELS[to];
}

// ---------- state ----------
let S;
const byId = (coll, id) => S[coll].find(x => x.id === id);
const jobsOf = (pred) => S.jobs.filter(pred);
const custOf = (job) => byId('customers', job.customerId);
const itemOf = (job) => byId('items', job.itemId);
const svcOf = (job) => S.services.find(s => s.id === job.serviceId);
const itemName = (job) => { const it = itemOf(job); return it ? [it.brand, it.model].filter(Boolean).join(' ') : 'item'; };
const custName = (c) => c ? [c.first, c.last].filter(Boolean).join(' ') : 'Customer';
const quotesOf = (job) => S.quotes.filter(q => q.jobId === job.id).sort((a,b) => a.version - b.version);
const currentQuote = (job) => quotesOf(job).filter(q => q.status !== 'superseded' && q.status !== 'draft').slice(-1)[0] || null;
const draftQuote = (job) => quotesOf(job).find(q => q.status === 'draft') || null;
const quoteTotal = (q) => q.lines.reduce((t,l) => t + Math.round(l.qty * l.unitCents), 0);
const paymentsOf = (job) => S.payments.filter(p => p.jobId === job.id && p.status === 'succeeded');
const photosOf = (job) => S.photos.filter(p => p.jobId === job.id);
const historyOf = (job) => S.history.filter(h => h.jobId === job.id);
const mailOf = (job) => S.notifications.filter(n => n.jobId === job.id);
const depositFor = (svc) => !svc ? 0 : (svc.depositCents || (svc.depositPct && svc.priceCents ? Math.round(svc.priceCents * svc.depositPct / 100) : 0));
const isOverdue = (job) => OPEN.includes(job.status) && job.status !== 'ready' && job.status !== 'requested' && job.promisedDate && job.promisedDate < todayStr();
const payEnabled = () => S.shop.stripe.chargesEnabled;
const estimateFeeSvc = () => S.services.find(s => s.isEstimateFee && s.active);

// Balance = service price + approved quote + return shipping (if ship) + estimate fee (declined/returned)
//           − deposits − payments.  The optional $1 online service fee is added at checkout only.
function balance(job){
  const svc = job.servicePriceCents || 0;
  const quote = quotesOf(job).filter(q => q.status === 'approved').reduce((t,q) => t + quoteTotal(q), 0);
  const ship = job.delivery === 'ship' ? (S.shop.returnShippingCents || 0) : 0;
  const ef = estimateFeeSvc();
  const estFee = ef && (job.status === 'declined' || job.closedHow === 'returned_unrepaired') ? (ef.priceCents || 0) : 0;
  const pays = paymentsOf(job);
  const deposits = pays.filter(p => p.purpose === 'deposit').reduce((t,p) => t + p.amountCents - p.feeLineCents, 0);
  const paid = pays.filter(p => p.purpose !== 'deposit').reduce((t,p) => t + p.amountCents - p.feeLineCents, 0);
  const due = svc + quote + ship + estFee - deposits - paid;
  const feePending = S.shop.passFee && !job.serviceFeeChargedAt && payEnabled() ? 100 : 0;
  return { svc, quote, ship, estFee, deposits, paid, due, feePending, total: svc + quote + ship + estFee };
}

// ---------- emails (the outbox). Subjects follow §5 of the product definition. ----------
function mail(job, template, side, subject, body, atTime){
  const c = custOf(job);
  S.notifications.push({ id: uid(), jobId: job.id, template, side, to: side === 'shop' ? S.shop.email : (c?.email || '(no email)'),
    subject, body, at: atTime || iso(now()) });
}
function promisedLine(job){ return job.promisedDate ? `Promised by ${fmtDate(job.promisedDate, {dow:true})}.` : "We'll confirm a date when it arrives."; }
function emailForTransition(job, from, to, note, atTime){
  const shop = S.shop.name, item = itemName(job);
  if (to === 'received'){
    if (job.kind === 'rod' && from === 'requested' && paymentsOf(job).some(p => p.purpose === 'deposit'))
      mail(job, 'deposit_paid', 'customer', `Deposit received — your rod order is confirmed`, `${shop} will start when the blank arrives; promised by ${fmtDate(job.promisedDate)}.`, atTime);
    else mail(job, 'item_received', 'customer', `${shop} has your ${item} — promised by ${job.promisedDate ? fmtDate(job.promisedDate) : 'a date we will confirm'}`, `Track it here. We'll email you if anything changes. Your job code is ${job.code}.`, atTime);
  } else if (['in_progress','waiting_parts','finishing'].includes(to)) {
    mail(job, 'status_update', 'customer', `Update on your ${item}: ${custLabel(job, to)}`, `${note ? note + ' ' : ''}${promisedLine(job)}`, atTime);
  } else if (to === 'ready') {
    const b = balance(job);
    if (job.delivery === 'ship') mail(job, 'ready_ship', 'customer', `Your ${item} is ready to ship`, b.due > 0 ? `Pay ${money(b.due)} and it goes out with tracking.` : `Paid in full; it goes out with tracking.`, atTime);
    else mail(job, 'ready_pickup', 'customer', `Your ${item} is ready at ${shop}`, b.due > 0 ? `Balance due ${money(b.due)}. Pay now or at pickup.` : `Paid in full. Come by any time we're open.`, atTime);
  } else if (to === 'closed') {
    if (job.closedHow === 'shipped') mail(job, 'shipped', 'customer', `Your ${item} is on its way`, `${job.carrier || 'Carrier'} ${job.tracking || ''}`.trim(), atTime);
    else if (job.closedHow === 'picked_up') mail(job, 'closed_pickup', 'customer', `Thanks from ${shop}`, `Your ${item} was picked up on ${fmtDate(job.closedAt || iso(now()))}; here's your service record.`, atTime);
  } else if (to === 'declined') {
    const ef = estimateFeeSvc();
    mail(job, 'declined_next_steps', 'customer', `You declined the quote — what happens next`, `We'll have your ${item} ready to collect${ef ? `; the ${money(ef.priceCents)} estimate fee is due at pickup` : ''}.`, atTime);
  }
}

// ---------- the state machine: every move writes history, usage and the right email ----------
function transition(job, to, opts={}){
  const from = job.status;
  if (!allowed(job).includes(to) && !opts.force) { toast(`Can't move from ${shopLabel(job)} to ${OTHER_LABELS[to] || to}`); return false; }
  const t = opts.at || iso(now());
  job.status = to;
  if (to === 'received' && !job.receivedAt) { job.receivedAt = t; recordUsage(job, t); }
  if (to === 'ready') { job.readyAt = t; if (opts.delivery) job.delivery = opts.delivery; }
  if (to === 'closed') { job.closedAt = t; job.closedHow = opts.closedHow || 'other'; job.closedNote = opts.note || ''; if (opts.carrier) job.carrier = opts.carrier; if (opts.tracking) job.tracking = opts.tracking; }
  if (to === 'cancelled') { job.closedAt = t; }
  S.history.push({ id: uid(), jobId: job.id, from, to, actor: opts.actor || 'shop', note: opts.note || '', customerVisible: opts.customerVisible !== false, at: t });
  if (!opts.silent) emailForTransition(job, from, to, opts.note, t);
  return true;
}
function recordUsage(job, t){
  if (S.usage.some(u => u.jobId === job.id)) return;
  S.usage.push({ jobId: job.id, at: t, periodMonth: t.slice(0,7) });
}
function monthUsage(ym){
  const evs = S.usage.filter(u => u.periodMonth === ym);
  let fee = 0, ledger = 0;
  for (const u of evs){ const j = byId('jobs', u.jobId); const viaCard = j && paymentsOf(j).some(p => p.method === 'card'); if (viaCard) fee++; else ledger++; }
  const n = evs.length; const gross = n * 100; const capped = Math.min(gross, 2900);
  return { n, fee, ledger, gross, capped, ledgerCents: Math.max(0, capped - fee * 100) };
}

// ---------- quotes ----------
function sendQuote(job, q, opts={}){
  const t = opts.at || iso(now());
  for (const o of quotesOf(job)) if (o.id !== q.id && (o.status === 'sent' || o.status === 'approved' || o.status === 'declined')) o.status = 'superseded';
  q.status = 'sent'; q.sentAt = t; q.expiresAt = iso(new Date(new Date(t).getTime() + (q.expiresDays || 14) * 86400000));
  transition(job, 'quote_sent', { at: t, note: opts.note || (q.version > 1 ? `Quote revised (v${q.version})` : ''), silent: true });
  mail(job, 'quote_sent', 'customer', `Quote from ${S.shop.name} for your ${itemName(job)}: ${money(quoteTotal(q))}`, 'Approve or decline with one tap; work starts after approval.', t);
}
function decideQuote(job, q, approve, via, note, atTime){
  const t = atTime || iso(now());
  q.status = approve ? 'approved' : 'declined'; q.decidedAt = t; q.decidedVia = via; q.decisionNote = note || '';
  transition(job, approve ? 'approved' : 'declined', { at: t, actor: via === 'token_page' ? 'customer' : 'shop', note: via === 'shop_on_behalf' ? `Recorded by the shop on the customer's behalf` : (note || '') });
  const c = custOf(job);
  mail(job, 'quote_decided_shop', 'shop', `${c.first} ${approve ? 'approved' : 'declined'} your quote for #${job.number} (${money(quoteTotal(q))})`, approve ? 'Next: order parts or start.' : 'Return it unrepaired or cancel.', t);
}

// ---------- payments ----------
function recordPayment(job, { purpose, method, amountCents, feeLineCents = 0, note = '', at: atTime }){
  const t = atTime || iso(now());
  S.payments.push({ id: uid(), jobId: job.id, purpose, method, status: 'succeeded', amountCents, feeLineCents, paidAt: t, note });
  if (feeLineCents) job.serviceFeeChargedAt = t;
  if (method === 'card' && purpose !== 'deposit') mail(job, 'payment_received', 'shop', `Payment received: ${money(amountCents)} for #${job.number} ${itemName(job)}`, balance(job).due <= 0 ? 'Paid in full; ready to go out.' : `Balance remaining ${money(balance(job).due)}.`, t);
}

// ---------- jobs ----------
function createJob({ customerId, itemId, serviceId, kind, source, problem, promisedDate, delivery, at: atTime, status = 'requested', servicePriceCents }){
  const t = atTime || iso(now());
  const svc = S.services.find(s => s.id === serviceId);
  const job = { id: uid(), number: S.shop.nextJobNumber++, code: shortCode(), token: randomToken(), customerId, itemId, serviceId, kind, source,
    status: 'requested', problem: problem || '', shopNotes: '', promisedDate: promisedDate || null, delivery: delivery || 'pickup',
    carrier: null, tracking: null, receivedAt: null, readyAt: null, closedAt: null, closedHow: null, closedNote: '',
    servicePriceCents: servicePriceCents ?? (svc?.priceCents || 0), serviceFeeChargedAt: null, createdAt: t };
  S.jobs.push(job);
  S.history.push({ id: uid(), jobId: job.id, from: null, to: 'requested', actor: source === 'public_page' ? 'customer' : 'shop', note: source === 'public_page' ? 'Sent from the public page' : 'Logged at the counter', customerVisible: true, at: t });
  if (status === 'received') transition(job, 'received', { at: t, actor: 'shop' });
  return job;
}
function upsertCustomer({ first, last, email, phone }){
  const e = (email || '').trim().toLowerCase();
  let c = e ? S.customers.find(x => (x.email || '').toLowerCase() === e) : null;
  if (!c && phone) c = S.customers.find(x => normPhone(x.phone) && normPhone(x.phone) === normPhone(phone));
  if (c) { if (!c.phone && phone) c.phone = phone; return c; }
  c = { id: uid(), first: first.trim(), last: (last || '').trim(), email: e || '', phone: phone || '', notes: '', createdAt: iso(now()) };
  S.customers.push(c); return c;
}
function addItem(customerId, kind, brand, model, serial, description){
  const it = { id: uid(), customerId, kind, brand: brand.trim(), model: (model || '').trim(), serial: (serial || '').trim(), description: description || '' };
  S.items.push(it); return it;
}
function addPhoto(job, kind, caption, visible=false){ S.photos.push({ id: uid(), jobId: job.id, kind, caption, customerVisible: visible, hue: ['#4a6a8a','#5b7a52','#8a6a4a','#6a5a8a','#4a7a7a'][S.photos.length % 5], at: iso(now()) }); }

// ===================================================================================
// Seed data: Storm Proof Tackle, Virginia Beach. Names, numbers and addresses are fictional.
// ===================================================================================
function seed(){
  S = { shop: null, services: [], customers: [], items: [], jobs: [], history: [], quotes: [], payments: [], photos: [], notifications: [], usage: [], invoices: [], credits: [],
        ui: { role: 'shop', tour: { open: false, step: 0 }, hl: null, lastToken: null, jobsFilter: { status: 'open', kind: 'all', q: '' }, deleted: null, sentJob: null } };
  S.shop = { name: 'Storm Proof Tackle', slug: 'storm-proof-tackle', codePrefix: 'SPT', city: 'Virginia Beach', region: 'VA', phone: '(757) 555-0188', email: 'service@stormprooftackle.example',
    mailAddress: 'Storm Proof Tackle\nPO Box 4471\nVirginia Beach, VA 23454', dropOff: 'Drop off at the bench Tue–Fri 10–6, Sat 9–1, or at Princess Anne Distributing Co. during their hours. Text before you come.',
    hours: 'Tue–Fri 10am–6pm · Sat 9am–1pm · Closed Sun–Mon', timezone: 'America/New_York', acceptsMailIn: true, acceptsDropOff: true,
    headline: 'Reel service and rod work, on the bench in Virginia Beach', intro: 'Spinning, conventional and lever-drag reels torn down, cleaned, lubed and drag-checked. Rod tips, guides and custom builds. Mail it in or drop it off; you get a tracking link and an email at every step.',

    uncollectedDays: 90, uncollectedPolicy: 'Items not collected or paid for within 90 days of being ready are considered abandoned and may be sold to cover the charges. We email reminders at 7 and 30 days.',
    returnShippingCents: 1500, passFee: false, published: true, closedUntil: null, closedMessage: 'Requests are still accepted and queued; work resumes when we reopen.',
    stripe: { chargesEnabled: true, accountId: 'acct_1QDemo7StormProof', connectedAt: '2026-03-14' },
    billingCard: { brand: 'Visa', last4: '4242', exp: '08/28' }, nextJobNumber: 1052 };

  const svc = (kind, category, name, priceCents, turnaroundDays, o={}) => { const s = { id: uid(), kind, category, name, priceCents, priceIsFrom: !!o.from, depositPct: o.depositPct || 0, depositCents: o.depositCents || 0, turnaroundDays, isEstimateFee: !!o.fee, active: true, desc: o.desc || '' }; S.services.push(s); return s; };
  const SV = {};
  SV.spin   = svc('reel','Freshwater reels','Spinning reel service', 3000, 10, { desc:'Full teardown, ultrasonic clean, fresh grease and oil, drag checked under load.' });
  SV.bait   = svc('reel','Freshwater reels','Baitcaster service', 3500, 10, { desc:'Teardown, bearings cleaned or replaced, brakes and levelwind set, cast-tested.' });
  SV.dirty  = svc('reel','Freshwater reels','Very dirty or sand surcharge', 1000, 0, { desc:'Added when a reel comes in packed with sand or old grease.' });
  SV.salt   = svc('reel','Saltwater and conventional','Saltwater spinning service', 4500, 14, { desc:'Teardown, salt and corrosion removed, seals checked, drag washers greased or replaced if worn.' });
  SV.conv   = svc('reel','Saltwater and conventional','Conventional / star drag service', 4500, 14, { desc:'Senators, Squalls, Fathoms, Torium: clean, lube, drag stack and clicker checked.' });
  SV.lever  = svc('reel','Saltwater and conventional','Lever drag / 2-speed service', 6000, 21, { desc:'Full strip including the drag cam and gear train; drag curve checked on the scale.' });
  SV.upg    = svc('reel','Saltwater and conventional','Storm Proof upgrade', 7500, 21, { from:true, desc:'Stainless or ceramic bearings and carbon drag washers fitted during a full service. Parts quoted first.' });
  SV.repair = svc('reel','Repairs','Repair — quoted after inspection', null, 14, { desc:'We open it, find the fault and send you a quote for parts and labour. Nothing is replaced without your approval.' });

function parseHash(){
  const h = (location.hash || '#/').replace(/^#/, '');
  const [path, qs] = h.split('?');
  const seg = path.split('/').filter(Boolean);
  const q = Object.fromEntries(new URLSearchParams(qs || ''));
  return { seg, q, path };
}
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }
function roleFor(seg){ if (seg[0] === 't') return 'customer'; if (seg[0] === 's') return 'public'; if (seg[0] === 'app') return 'shop'; return 'landing'; }

function toast(msg, cls=''){ const box = $('#toasts'); while (box.children.length >= 2) box.firstChild.remove(); const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg; box.appendChild(t); setTimeout(() => t.remove(), 3800); }
const $ = (s) => document.querySelector(s);

let sheetCleanup = null;
function openSheet(html, opts={}){ const d = $('#sheet'); d.innerHTML = `<div class="sheet" role="document">${html}</div>`; d.className = opts.cls || ''; if (!d.open) d.showModal(); const f = d.querySelector('[autofocus]') || d.querySelector('input,select,textarea,button'); if (f) f.focus(); }
function closeSheet(){ const d = $('#sheet'); if (d.open) d.close(); d.innerHTML = ''; }
function sheetHead(title){ return `<div class="head"><h2 id="sheet-title">${esc(title)}</h2><button class="btn icon sm" data-act="sheet-close" aria-label="Close">${icon('x')}</button></div>`; }

// CSV export: a real Blob download plus a copy alternative.
function toCSV(rows){ if (!rows.length) return ''; const cols = Object.keys(rows[0]); const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }; return [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\n'); }
function exportRows(kind){
  if (kind === 'customers') return S.customers.map(c => ({ id:c.id, first_name:c.first, last_name:c.last, email:c.email, phone:c.phone, notes:c.notes, created_at:c.createdAt }));
  if (kind === 'items') return S.items.map(i => ({ id:i.id, customer_id:i.customerId, kind:i.kind, brand:i.brand, model:i.model, serial:i.serial, description:i.description }));
  if (kind === 'jobs') return S.jobs.map(j => ({ id:j.id, job_number:j.number, short_code:j.code, customer_id:j.customerId, item_id:j.itemId, kind:j.kind, source:j.source, status:j.status, problem:j.problem, promised_date:j.promisedDate, delivery:j.delivery, received_at:j.receivedAt, ready_at:j.readyAt, closed_at:j.closedAt, closed_how:j.closedHow, service_price_cents:j.servicePriceCents, balance_cents:balance(j).due }));
  if (kind === 'quotes') return S.quotes.flatMap(q => q.lines.map(l => ({ quote_id:q.id, job_id:q.jobId, version:q.version, status:q.status, line_kind:l.kind, description:l.description, qty:l.qty, unit_cents:l.unitCents, total_cents:Math.round(l.qty*l.unitCents) })));
  if (kind === 'payments') return S.payments.map(p => ({ id:p.id, job_id:p.jobId, purpose:p.purpose, method:p.method, status:p.status, amount_cents:p.amountCents, fee_line_cents:p.feeLineCents, paid_at:p.paidAt, note:p.note }));
  return [];
}
function downloadCSV(kind){
  const csv = toCSV(exportRows(kind));
  try { const blob = new Blob([csv], { type: 'text/csv' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `bench-tag-${S.shop.slug}-${kind}-${todayStr()}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast(`${kind}.csv downloaded (${exportRows(kind).length} rows)`); }
  catch (e) { toast('Download blocked here; use Copy instead'); }
}
async function copyText(text, what='Copied'){
  try { await navigator.clipboard.writeText(text); toast(what, 'ok'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(what, 'ok'); } catch (e2) { toast('Select and copy the text by hand'); } ta.remove(); }
}

// deterministic QR-looking placeholder (not a real QR code)
function qrSvg(seedStr){ let h = 0; for (const ch of seedStr) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const n = 21; let cells = '';
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="var(--surface)"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){ const inF = (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if (!inF && rnd() > .55) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 ${n} ${n}" role="img" aria-label="QR code placeholder" fill="var(--fg)">${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}${cells}</svg>`; }

const paidBadge = (job) => { const b = balance(job); if (job.status === 'requested' || (b.total === 0 && b.deposits === 0)) return ''; if (b.due <= 0) return `<span class="badge paid">Paid</span>`; if (b.deposits + b.paid > 0) return `<span class="badge owing">${money(b.due)} due</span>`; return `<span class="badge owing">${money(b.due)} due</span>`; };
function promisedCell(job){

function updateRequestServiceHint(){
  const sel = $('#rq-service'); if (!sel) return; const s = S.services.find(x => x.id === sel.value); const h = $('#rq-svc-hint'); if (!s || !h) return;
  const dep = depositFor(s);

}

function statusHeadline(job){
  const n = itemName(job), s = job.status;
  const m = { requested: job.kind === 'rod' ? 'Your rod order is placed' : "We're expecting your " + n, received: job.kind === 'rod' ? 'Your order is confirmed' : 'Your ' + n + ' is here', diagnosing: 'On the bench for a look', quote_sent: 'We found something and need your OK', approved: 'Approved, in the queue', declined: 'Quote declined, we\'ll get it back to you', in_progress: job.kind === 'rod' ? 'Being built' : 'Being serviced', waiting_parts: 'Waiting for parts', finishing: job.kind === 'rod' ? 'Wrapping and finishing' : 'Almost done', ready: job.delivery === 'ship' ? 'Ready to ship' : 'Ready for pickup', closed: custLabel(job), cancelled: 'Cancelled' };
  return m[s];
}
const LINE_KIND = { labor:'Labour', part:'Part', shipping:'Shipping', fee:'Fee', discount:'Discount' };
const quoteLine = (l) => `<div class="line ${l.unitCents < 0 ? 'neg' : ''}"><div class="d">${esc(l.description)}<div class="sub">${LINE_KIND[l.kind]}${l.qty !== 1 ? ` · ${l.qty} × ${money(l.unitCents)}` : ''}</div></div><div class="amt">${money(Math.round(l.qty * l.unitCents))}</div></div>`;
function balanceLines(job, b){
  const svc = svcOf(job); const out = [];
  if (b.svc) out.push(`<div class="line"><div class="d">${esc(svc ? svc.name : 'Service')}<div class="sub">${esc(itemName(job))}</div></div><div class="amt">${money(b.svc)}</div></div>`);
  else if (svc) out.push(`<div class="line"><div class="d">${esc(svc.name)}<div class="sub">${svc.priceCents == null ? 'Quoted after inspection' : esc(itemName(job))}</div></div><div class="amt">${money(0)}</div></div>`);
  if (b.quote) out.push(`<div class="line"><div class="d">Parts and labour<div class="sub">approved quote</div></div><div class="amt">${money(b.quote)}</div></div>`);
  if (b.ship) out.push(`<div class="line"><div class="d">Return shipping</div><div class="amt">${money(b.ship)}</div></div>`);
  if (b.estFee) out.push(`<div class="line"><div class="d">Estimate fee<div class="sub">quote declined</div></div><div class="amt">${money(b.estFee)}</div></div>`);
  for (const p of paymentsOf(job)) out.push(`<div class="line neg"><div class="d">${p.purpose === 'deposit' ? 'Deposit' : 'Payment'} · ${p.method === 'card' ? 'card' : p.method} · ${fmtDate(p.paidAt)}${p.feeLineCents ? `<div class="sub">includes $1.00 online service fee</div>` : ''}</div><div class="amt">−${money(p.amountCents - p.feeLineCents)}</div></div>`);
  out.push(`<div class="line total"><div class="d">${b.due <= 0 ? 'Balance' : 'Balance due'}</div><div class="amt">${money(Math.max(0, b.due))}</div></div>`);
  return out.join('');
}
const photoTile = (p, shopSide=false) => `<figure class="photo" style="margin:0"><div class="img" style="--p:${p.hue}">${icon(p.kind === 'quote' ? 'search' : 'camera')}<span class="k">${esc(p.kind)}</span></div><figcaption class="cap">${esc(p.caption)}</figcaption>${shopSide ? `<label class="switch vis"><input type="checkbox" data-change="photo-vis" data-id="${p.id}" ${p.customerVisible ? 'checked' : ''}><span class="trk"></span><span>Customer can see</span></label>` : ''}</figure>`;

function Today(){
  const open = S.jobs.filter(j => OPEN.includes(j.status));
  const overdue = open.filter(isOverdue).sort(sortPromised);
  const week = open.filter(j => !isOverdue(j) && !['ready','requested','quote_sent','declined'].includes(j.status) && j.promisedDate && daysBetween(todayStr(), j.promisedDate) <= 7).sort(sortPromised);
  const ready = open.filter(j => j.status === 'ready').sort((a,b) => a.readyAt < b.readyAt ? -1 : 1);
  const requests = open.filter(j => j.status === 'requested').sort((a,b) => a.createdAt < b.createdAt ? 1 : -1);
  const waiting = open.filter(j => j.status === 'quote_sent' || j.status === 'declined').sort(sortPromised);
  const ym = todayStr().slice(0,7); const mu = monthUsage(ym);
  const collected = S.payments.filter(p => p.status === 'succeeded' && p.paidAt.slice(0,7) === ym).reduce((t,p) => t + p.amountCents, 0);
  const uncollected = ready.filter(j => daysBetween(j.readyAt.slice(0,10), todayStr()) >= 7).length;
  return `<div class="page">
    ${pageHead(`Today <span class="muted" style="font-weight:500">· ${fmtDate(todayStr(), {dow:true})}</span>`, `${esc(S.shop.name)} · ${open.length} open jobs on the bench`, `<div class="quick"><a class="btn primary" href="#/app/jobs/new">${icon('plus')} New job</a><a class="btn" href="#/app/jobs">${icon('search')} Search</a></div>`)}

      <a class="kpi ${uncollected ? 'warn' : 'ok'}" href="#/app?to=ready"><span class="v">${ready.length}</span><span class="l">Ready and waiting${uncollected ? ` · ${uncollected} over 7 days` : ''}</span></a>
      <a class="kpi" href="#/app?to=requests"><span class="v">${requests.length}</span><span class="l">New requests</span></a>
      <a class="kpi" href="#/app/billing"><span class="v">${mu.n} <span class="small muted" style="font-weight:600">→ ${money(mu.capped)}</span></span><span class="l">Jobs this month · cap $29</span></a>
      <div class="kpi"><span class="v">${money(collected)}</span><span class="l">Collected in ${MONTHS[+ym.slice(5)-1]}</span></div>
    </div>
    <div class="stack" style="gap:18px">
      <section id="overdue" class="stack-s"><h2 class="row">Overdue <span class="badge late">${overdue.length}</span></h2>${jobList(overdue, 'Nothing overdue. Every promised date is still ahead of you.')}</section>
      <section id="requests" class="stack-s"><h2 class="row">New requests <span class="badge">${requests.length}</span></h2><p class="small muted">Sent from your public page. They count toward billing only when you mark them received.</p>${jobList(requests, 'No new requests waiting.')}</section>
      <section id="due-week" class="stack-s"><h2 class="row">Due this week <span class="badge">${week.length}</span></h2>${jobList(week, 'Nothing promised in the next seven days.')}</section>
      <section id="ready" class="stack-s"><h2 class="row">Ready and waiting <span class="badge">${ready.length}</span></h2><p class="small muted">Reminders go out at 7 and 30 days; the final notice at ${S.shop.uncollectedDays} days.</p>${jobList(ready, 'Nothing waiting to be collected.')}</section>
      <section class="stack-s"><h2 class="row">Waiting on the customer <span class="badge">${waiting.length}</span></h2><p class="small muted">Quotes sent and not answered, or declined and waiting to go back.</p>${jobList(waiting, 'No quotes waiting.')}</section>

function jobsFiltered(){
  const f = S.ui.jobsFilter; let list = S.jobs.slice();
  if (f.status === 'open') list = list.filter(j => OPEN.includes(j.status)); else if (f.status !== 'all') list = list.filter(j => j.status === f.status);
  if (f.kind !== 'all') list = list.filter(j => j.kind === f.kind);
  const q = f.q.trim().toLowerCase(); const qd = normPhone(q);
  if (q) list = list.filter(j => { const c = custOf(j), it = itemOf(j); return [String(j.number), j.code, c?.first, c?.last, c?.email, it?.brand, it?.model, it?.serial, j.problem].some(x => (x || '').toLowerCase().includes(q)) || (qd.length >= 3 && normPhone(c?.phone).includes(qd)); });
  if (f.status === 'closed' || f.status === 'cancelled') list.sort((a,b) => a.closedAt < b.closedAt ? 1 : -1); else list.sort(sortPromised);
  return list;
}

// ---------- customers ----------
function custSummary(c){ const jobs = S.jobs.filter(j => j.customerId === c.id); const open = jobs.filter(j => OPEN.includes(j.status)); const owed = open.reduce((t,j) => t + Math.max(0, balance(j).due), 0); const last = jobs.map(j => j.createdAt).sort().slice(-1)[0]; return { jobs, open, owed, last, items: S.items.filter(i => i.customerId === c.id) }; }
function custMatches(q){ q = q.trim().toLowerCase(); const qd = normPhone(q); if (!q) return []; return S.customers.filter(c => [c.first, c.last, c.email, custName(c)].some(x => (x || '').toLowerCase().includes(q)) || (qd.length >= 3 && normPhone(c.phone).includes(qd))); }
const custListHtml = (list) => list.length ? `<div class="jobs">${list.map(c => { const s = custSummary(c); return `<a class="job" href="#/app/customers/${c.id}"><div class="l1"><span class="item">${esc(custName(c))}</span>${s.open.length ? `<span class="badge">${s.open.length} open</span>` : ''}${s.owed ? `<span class="badge owing">${money(s.owed)} owed</span>` : ''}</div><div class="l2"><span class="mono">${esc(c.phone)}</span><span>${esc(c.email)}</span><span class="faint">${s.items.length} item${s.items.length === 1 ? '' : 's'} · ${s.jobs.length} job${s.jobs.length === 1 ? '' : 's'}</span></div><div class="date"><b>${s.last ? fmtDate(s.last) : ''}</b><span class="faint">last job</span></div></a>`; }).join('')}</div>` : `<div class="empty">No customers match.</div>`;
function Customers(q){
  const list = S.customers.slice().sort((a,b) => (custSummary(b).last || '') < (custSummary(a).last || '') ? -1 : 1);
  return `<div class="page">${pageHead('Customers', `${S.customers.length} people · search by name, phone, email`, `<a class="btn primary" href="#/app/jobs/new">${icon('plus')} New job</a>`)}
    <div class="stack"><div class="search"><label class="sr-only" for="cust-q">Search customers</label>${icon('search')}<input id="cust-q" type="search" placeholder="Name, phone or email" data-input="cust-q" autocomplete="off"></div><div id="cust-list">${custListHtml(list)}</div></div></div>`;
}

        ${pays.length ? `<section class="panel stack" aria-labelledby="cp-h"><h2 id="cp-h">Payments</h2><div class="tbl-wrap"><table><thead><tr><th>When</th><th>Job</th><th>What</th><th>How</th><th class="num">Amount</th></tr></thead><tbody>${pays.map(p => { const j = byId('jobs', p.jobId); return `<tr><td>${fmtDate(p.paidAt)}</td><td><a href="#/app/jobs/${j.id}">#${j.number}</a> ${esc(itemName(j))}</td><td>${p.purpose}</td><td>${p.method}</td><td class="num">${money(p.amountCents)}</td></tr>`; }).join('')}</tbody></table></div></section>` : ''}

  const credit = S.credits.reduce((t,c) => t + c.remainingCents, 0);
  const pctFee = Math.min(100, mu.fee / 29 * 100), pctLedger = Math.min(100 - pctFee, mu.ledger / 29 * 100);
  const idle = ['2026-01','2026-02','2026-03'];
  return `<div class="page">
    ${pageHead('Billing', 'What Bench Tag charges you. Your customers\' payments go straight to your Stripe account and never show here.')}
    <div class="stack">
      <div class="notice ok row">${icon('check')}<div><b>In good standing.</b> Next charge Nov 1 for October's ledger part${credit ? ', taken from your prepaid credit first' : `, to ${S.shop.billingCard.brand} •••• ${S.shop.billingCard.last4}`}, and only if it's $5 or more.</div></div>

        <div class="bar" role="img" aria-label="${mu.fee} dollars collected as fees on customer payments, ${mu.ledger} dollars on your ledger, out of a 29 dollar cap"><span class="fee" style="width:${pctFee}%"></span><span class="ledger" style="width:${pctLedger}%"></span></div>
        <div class="legend"><span class="fee"><i></i><b>${money(mu.fee*100)}</b> collected as a $1 fee on customer payments (${mu.fee} jobs)</span><span class="ledger"><i></i><b>${money(mu.ledgerCents)}</b> on your ledger (${mu.ledger} jobs)</span><span class="faint">${left ? `${left} more job${left === 1 ? '' : 's'} and the rest of ${MONTHS[+ym.slice(5)-1]} is free` : 'Capped: the rest of the month is free'}</span></div>
        <p class="small muted">Ledger balances are charged to your card only at $5 or more, or when you hit the $29 cap; smaller amounts roll into the next month. $0 in a month with no jobs.</p>
      </section>
      <div class="grid-2">
        <section class="panel stack-s" aria-labelledby="pp-h"><h3 id="pp-h">Prepay a year: $290</h3><p class="small muted">Ten capped months for the price of ten. Credit is used before your card, expires 12 months after purchase, refundable in full within 30 days if unused.</p>${credit ? `<div class="notice ok small"><b>${money(credit)}</b> of prepaid credit on your account.</div>` : ''}<div><button type="button" class="btn" data-act="prepay">${icon('card')} Prepay $290</button></div></section>
        <section class="panel stack-s" aria-labelledby="cof-h"><h3 id="cof-h">Card on file</h3><div class="row between"><span class="row nowrap">${icon('card')} ${S.shop.billingCard.brand} •••• ${S.shop.billingCard.last4}</span><span class="muted small">exp ${S.shop.billingCard.exp}</span></div><p class="small muted">Added at signup; charged on the 1st when the ledger part is due. If it fails we email you and retry on day 3 and 7; after 14 days the account goes read-only until it clears. Nothing is deleted.</p><div><button type="button" class="btn sm" data-act="toast" data-msg="In the real product this opens Stripe to update the card">Update card</button></div></section>
      </div>
      <section class="panel stack-s" aria-labelledby="inv-h"><div class="head"><h3 id="inv-h">Invoices</h3><span class="small muted">Idle months cost $0 and don't appear: ${idle.map(m => MONTHS[+m.slice(5)-1]).join(', ')} this year.</span></div>

let lastPath = null;
function render(){
  const route = parseHash(); const seg = route.seg;
  renderChrome(route);
  document.body.classList.remove('has-actionbar');
  let html;
  try {
    if (seg.length === 0) html = Landing();
    else if (seg[0] === 's') { if (seg[1] !== S.shop.slug) html = NotFound(); else if (seg[2] === 'request') html = RequestForm(route.q); else if (seg[2] === 'sent') html = Sent(seg[3]); else html = PublicPage(); }
    else if (seg[0] === 't') html = seg[1] ? StatusPage(seg[1], route.q) : StatusPicker();
    else if (seg[0] === 'app') {
      if (!seg[1]) html = Today();
      else if (seg[1] === 'jobs') { if (!seg[2]) html = Jobs(); else if (seg[2] === 'new') { html = NewJob(route.q); document.body.classList.add('has-actionbar'); } else if (seg[3] === 'receipt') html = Receipt(seg[2]); else { html = JobDetail(seg[2]); document.body.classList.add('has-actionbar'); } }
      else if (seg[1] === 'customers') html = seg[2] ? CustomerDetail(seg[2]) : Customers();
      else if (seg[1] === 'billing') html = Billing();
      else if (seg[1] === 'settings') html = Settings();
      else if (seg[1] === 'page') html = PageSettings();
      else html = NotFound();
    } else html = NotFound();
  } catch (e) { console.error(e); html = `<div class="page narrow"><div class="notice bad">Something broke while drawing this screen: ${esc(e.message)}. <button type="button" class="linkish" data-act="reset-demo">Reset demo</button></div></div>`; }
  $('#main').innerHTML = html;
  document.title = titleFor(seg);
  updateRequestServiceHint(); njUpdateServiceHint();
  if (route.path !== lastPath) { lastPath = route.path; window.scrollTo(0, 0); if (!S.ui.hl) $('#main').focus({ preventScroll: true }); }
  if (route.q.to) { const t = document.getElementById(route.q.to); if (t) setTimeout(() => t.scrollIntoView({ block: 'start', behavior: 'smooth' }), 30); }
  if (S.ui.hl) { const el = document.querySelector(`[data-hl="${S.ui.hl}"]`); S.ui.hl = null; if (el) { el.classList.add('hl'); setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 50); setTimeout(() => el.classList.remove('hl'), 4500); } }
}
function titleFor(seg){ const base = 'Bench Tag demo'; if (!seg.length) return base; if (seg[0] === 's') return `${S.shop.name} · ${base}`; if (seg[0] === 't') return `Your job status · ${base}`; const m = { jobs: 'Jobs', customers: 'Customers', billing: 'Billing', settings: 'Settings', page: 'Public page' }; return `${m[seg[1]] || 'Today'} · ${base}`; }

function doMove(job, to){
  if (to === 'quote_sent') { closeSheet(); ensureDraft(job, true); render(); $('#ql-desc')?.focus(); return; }
  if (to === 'ready') return sheetReady(job);
  if (to === 'closed') return sheetClose(job);
  if (to === 'cancelled') return sheetCancel(job);
  if (to === 'approved' && job.status === 'quote_sent') return sheetOnBehalf(job, 'approve');
  if (to === 'declined' && job.status === 'quote_sent') return sheetOnBehalf(job, 'decline');
  closeSheet();
  if (to === 'received' && !job.promisedDate) { const s = svcOf(job); job.promisedDate = addDays(todayStr(), s?.turnaroundDays || 10); }
  if (transition(job, to)) { const sent = ['received','in_progress','waiting_parts','finishing'].includes(to); toast(`${shopLabel(job)}${sent ? ' · customer emailed' : ''}${to === 'received' ? ` · promised ${fmtDate(job.promisedDate)}` : ''}`, 'ok'); render(); }
}
function ensureDraft(job, copyCurrent){
  let dq = draftQuote(job); if (dq) return dq;
  const cq = currentQuote(job);
  dq = { id: uid(), jobId: job.id, version: quotesOf(job).length + 1, status: 'draft', note: copyCurrent && cq ? cq.note : '', lines: copyCurrent && cq ? cq.lines.map(l => ({ ...l })) : [], expiresDays: 14 };
  S.quotes.push(dq); return dq;
}
function checkoutLinesFor(job){
  const b = balance(job); const lines = [{ label: `Balance — #${job.number} ${itemName(job)}`, sub: [b.svc ? svcOf(job)?.name : null, b.quote ? 'parts and labour (approved quote)' : null, b.ship ? 'return shipping' : null, b.estFee ? 'estimate fee' : null, (b.deposits + b.paid) ? `less ${money(b.deposits + b.paid)} already paid` : null].filter(Boolean).join(' + ').replace(' + less', ', less'), cents: b.due }];
  if (b.feePending) lines.push({ label: 'Online service fee', sub: 'once per job, set by the shop', cents: 100 });
  return lines;
}
