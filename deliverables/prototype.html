  'export-copy'(d){ copyText(toCSV(exportRows(d.kind)), `${d.kind}.csv copied to the clipboard`); },
  'stripe-connect'(){ S.shop.stripe = { chargesEnabled: true, accountId: 'acct_1QDemo7StormProof', connectedAt: todayStr() }; toast('Stripe connected: charges enabled', 'ok'); render(); },
  'stripe-disconnect'(){ openSheet(`${sheetHead('Disconnect Stripe?')}<p class="small muted">Payment links and card checkout turn off at once. Jobs, quotes and status emails keep working; your page says "pay at pickup". Reconnect any time.</p><div class="actions"><button type="button" class="btn" data-act="sheet-close">Keep connected</button><button type="button" class="btn danger" data-act="stripe-disconnect-confirm">Disconnect</button></div>`); },
  'stripe-disconnect-confirm'(){ S.shop.stripe.chargesEnabled = false; S.shop.passFee = false; closeSheet(); toast('Stripe disconnected — payment links are off'); render(); },
  'delete-shop'(){ openSheet(`${sheetHead('Delete the shop')}<form data-form="delete-shop" class="stack"><p class="small muted">Type <b class="mono">${esc(S.shop.slug)}</b> to confirm. Export your CSVs first; after 30 days nothing can be recovered.</p><div class="field"><label for="del-slug">Shop slug</label><input id="del-slug" name="slug" class="mono" autocomplete="off" autofocus></div><div class="actions"><button type="button" class="btn" data-act="sheet-close">Keep my shop</button><button type="submit" class="btn danger">Schedule deletion</button></div></form>`); },
  'delete-undo'(){ S.ui.deleted = null; toast('Deletion cancelled', 'ok'); render(); },
};

const FORMS = {
  request(form){
    const fd = new FormData(form); const v = k => (fd.get(k) || '').toString().trim();
    const errs = {};
    if (!v('brand')) errs.brand = 'Tell us the brand.';
    if (!v('problem')) errs.problem = fd.get('kind') === 'rod' ? 'Tell us what you want built or fixed.' : "Tell us what it's doing.";
    if (!v('first')) errs.first = 'We need a first name.';
    if (!v('email') && !v('phone')) errs.email = 'Give us an email or a phone number so we can reach you.';
    if (v('email') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))) errs.email = "That email doesn't look right.";
    if (!fd.get('consent')) errs.consent = 'Tick the box so the shop may contact you about this job.';
    if (!$('#turnstile')?.classList.contains('ok')) errs.turnstile = 'Tap the verification box first.';
    form.querySelectorAll('.field.invalid').forEach(f => { f.classList.remove('invalid'); f.querySelector('.err')?.remove(); });
    $('#rq-err').innerHTML = '';
    const keys = Object.keys(errs);
    if (keys.length) {
      for (const k of keys) { const input = form.querySelector(`[name="${k}"]`); const f = input?.closest('.field'); if (f) { f.classList.add('invalid'); f.insertAdjacentHTML('beforeend', `<div class="err" role="alert">${esc(errs[k])}</div>`); } }
      $('#rq-err').innerHTML = `<div class="notice bad" role="alert">${esc(errs[keys[0]])}${keys.length > 1 ? ` (${keys.length} things to fix)` : ''}</div>`;
      (form.querySelector(`[name="${keys[0]}"]`) || $('#turnstile .box'))?.focus(); return;
    }
    const kind = v('kind') === 'rod' ? 'rod' : 'reel'; const svc = S.services.find(s => s.id === v('serviceId'));
    const c = upsertCustomer({ first: v('first'), last: v('last'), email: v('email'), phone: v('phone') });
    const it = addItem(c.id, kind, v('brand'), v('model'), v('serial'), kind === 'rod' ? v('problem') : '');
    const job = createJob({ customerId: c.id, itemId: it.id, serviceId: svc.id, kind, source: 'public_page', problem: v('problem'), delivery: v('delivery') || 'pickup', servicePriceCents: svc.priceCents || 0 });
    mail(job, 'intake_received', 'customer', `${S.shop.name} got your request — your tracking link`, `We'll confirm when your ${itemName(job)} arrives. Track it here any time. Your job code is ${job.code}.`);
    mail(job, 'new_request', 'shop', `New request: ${kind} ${it.brand} ${it.model} from ${c.first}`, 'Open it in Bench Tag.');
    S.ui.lastToken = job.token;
    const dep = depositFor(svc); const done = () => go(`#/s/${S.shop.slug}/sent/${job.id}`);
    if (dep && payEnabled()) { S.ui.checkoutCancel = done; openCheckout({ title: 'Deposit for your rod order', payee: S.shop.name, lines: [{ label: `Deposit — ${svc.name}`, sub: `${svc.depositPct}% of the ${money(svc.priceCents)} base price; the balance is due when it's ready`, cents: dep }], onSuccess(total){ recordPayment(job, { purpose: 'deposit', method: 'card', amountCents: total }); if (kind === 'rod') { job.promisedDate = addDays(todayStr(), svc.turnaroundDays || 42); transition(job, 'received', { actor: 'system', note: 'Deposit paid; order confirmed' }); } done(); } }); }
    else done();
  },
  'find-job'(form){
    const fd = new FormData(form); const code = normCode(fd.get('code')); const contact = (fd.get('contact') || '').toString().trim().toLowerCase(); const msg = $('#find-msg');
    const job = S.jobs.find(j => normCode(j.code) === code);
    const c = job && custOf(job);
    const ok = job && c && ((c.email && c.email.toLowerCase() === contact) || (c.phone && normPhone(contact).length >= 7 && normPhone(c.phone) === normPhone(contact)));
    if (ok) { S.ui.lastToken = job.token; go(`#/t/${job.token}`); return; }
    msg.innerHTML = `<span class="late">No match for that code and contact.</span> Check the code on your receipt or hang tag, or call the shop at ${esc(S.shop.phone)}.`;
  },
  'new-job'(form){
    const fd = new FormData(form); const v = k => (fd.get(k) || '').toString().trim();
    const err = (m, sel) => { $('#nj-err').innerHTML = `<div class="notice bad" role="alert">${esc(m)}</div>`; (sel && $(sel))?.focus(); $('#nj-err').scrollIntoView({ block: 'center' }); };
    let c = S.ui.nj.customerId ? byId('customers', S.ui.nj.customerId) : null;
    if (!c) { if (!v('first')) return err('Pick a customer or give a first name.', '#nj-cust-q'); if (!v('phone') && !v('email')) return err('A phone or an email, so the status link has somewhere to go.', '#nj-phone'); c = upsertCustomer({ first: v('first'), last: v('last'), email: v('email'), phone: v('phone') }); }
    if (!v('brand')) return err('Brand is needed.', '#nj-brand');
    const kind = v('kind') === 'rod' ? 'rod' : 'reel'; const svc = S.services.find(s => s.id === v('serviceId')); if (!svc) return err('Pick a service.', '#nj-service');
    const price = Math.round(parseFloat(v('price') || '0') * 100) || 0;
    const it = addItem(c.id, kind, v('brand'), v('model'), v('serial'), kind === 'rod' ? v('problem') : '');
    const job = createJob({ customerId: c.id, itemId: it.id, serviceId: svc.id, kind, source: 'counter', problem: v('problem'), promisedDate: v('promised') || addDays(todayStr(), svc.turnaroundDays || 0), delivery: v('delivery') || 'pickup', status: 'received', servicePriceCents: price });
    for (const name of S.ui.nj.photos) addPhoto(job, 'intake', name, true);
    S.ui.lastToken = job.token;
    const dep = v('deposit'); let depCents = 0; const ef = estimateFeeSvc();
    if (dep === 'fee' && ef) depCents = ef.priceCents; else if (dep === 'half') depCents = Math.round(price / 2); else if (dep === 'custom') depCents = Math.round(parseFloat(v('depositCustom') || '0') * 100) || 0;
    const method = v('depositMethod') || 'cash'; const done = () => go(`#/app/jobs/${job.id}/receipt`);
    if (depCents > 0 && method === 'card' && payEnabled()) { S.ui.checkoutCancel = () => { toast('Deposit not collected; job saved'); done(); }; openCheckout({ title: `Deposit for #${job.number}`, payee: S.shop.name, lines: [{ label: `Deposit — ${svc.name}`, sub: itemName(job), cents: depCents }], note: 'Hand the phone to the customer.', onSuccess(total){ recordPayment(job, { purpose: 'deposit', method: 'card', amountCents: total }); done(); } }); }
    else { if (depCents > 0) recordPayment(job, { purpose: 'deposit', method, amountCents: depCents, note: 'Collected at the counter' }); done(); }
  },
  notes(form){ const job = byId('jobs', form.dataset.id); job.shopNotes = new FormData(form).get('notes').toString(); toast('Notes saved', 'ok'); },
  'quote-line'(form){ const job = byId('jobs', form.dataset.id); const dq = ensureDraft(job); const fd = new FormData(form); const desc = fd.get('description').toString().trim(); const qty = parseFloat(fd.get('qty')) || 1; let unit = Math.round(parseFloat(String(fd.get('unit')).replace(/[$,]/g, '')) * 100); if (!desc || isNaN(unit)) { toast('A description and a price, please'); return; } if (fd.get('kind') === 'discount' && unit > 0) unit = -unit; dq.lines.push({ kind: fd.get('kind'), description: desc, qty, unitCents: unit }); render(); $('#ql-desc')?.focus(); },
  'mark-ready'(form){ const job = byId('jobs', form.dataset.id); const fd = new FormData(form); closeSheet(); if (transition(job, 'ready', { delivery: fd.get('delivery'), note: fd.get('note').toString().trim() })) { toast(`Ready · customer emailed${balance(job).due > 0 ? ` with the ${money(balance(job).due)} balance` : ''}`, 'ok'); render(); } },
  'close-job'(form){ const job = byId('jobs', form.dataset.id); const fd = new FormData(form); const how = fd.get('how'); const note = fd.get('note').toString().trim(); const b = balance(job);
    if (b.due > 0 && !fd.get('override')) { toast(`${money(b.due)} still due: tick "Close anyway" or record the payment first`); return; }
    if (b.due > 0 && !note) { toast('Give a reason for closing with a balance'); $('#cj-note')?.focus(); return; }
    if (how === 'abandoned' && !note) { toast('A note is required to close as abandoned'); $('#cj-note')?.focus(); return; }
    if (how === 'shipped' && !fd.get('tracking').toString().trim()) { toast('Enter the tracking number'); $('#cj-track')?.focus(); return; }
    closeSheet(); transition(job, 'closed', { closedHow: how, note: b.due > 0 ? `Closed with ${money(b.due)} outstanding: ${note}` : note, carrier: fd.get('carrier'), tracking: fd.get('tracking')?.toString().trim() }); toast(`Closed: ${custLabel(job)}`, 'ok'); render(); },
  'mark-paid'(form){ const job = byId('jobs', form.dataset.id); const fd = new FormData(form); const amt = Math.round(parseFloat(String(fd.get('amount')).replace(/[$,]/g, '')) * 100); if (!(amt > 0)) { toast('Enter an amount'); return; } recordPayment(job, { purpose: 'balance', method: fd.get('method'), amountCents: amt, note: fd.get('note').toString().trim() }); closeSheet(); toast(`${money(amt)} recorded`, 'ok'); render(); },
  promised(form){ const job = byId('jobs', form.dataset.id); const fd = new FormData(form); const d = fd.get('date'); const note = fd.get('note').toString().trim(); const old = job.promisedDate; job.promisedDate = d; S.history.push({ id: uid(), jobId: job.id, from: job.status, to: job.status, actor: 'shop', note: `Promised date moved from ${old ? fmtDate(old) : 'none'} to ${fmtDate(d)}${note ? ': ' + note : ''}`, customerVisible: true, at: iso(now()) }); if (OPEN.includes(job.status) && job.status !== 'requested') mail(job, 'promised_date_changed', 'customer', `New promised date for your ${itemName(job)}: ${fmtDate(d)}`, note); closeSheet(); toast(`Promised ${fmtDate(d, {dow:true})}${job.status !== 'requested' ? ' · customer emailed' : ''}`, 'ok'); render(); },
  'send-update'(form){ const job = byId('jobs', form.dataset.id); const text = new FormData(form).get('text').toString().trim(); if (!text) return; S.history.push({ id: uid(), jobId: job.id, from: job.status, to: job.status, actor: 'shop', note: text, customerVisible: true, at: iso(now()) }); mail(job, 'status_update', 'customer', `Update on your ${itemName(job)}: ${custLabel(job)}`, `${text} ${promisedLine(job)}`); closeSheet(); toast('Update sent', 'ok'); render(); },
  'cancel-job'(form){ const job = byId('jobs', form.dataset.id); const reason = new FormData(form).get('reason').toString().trim(); closeSheet(); if (transition(job, 'cancelled', { note: reason })) { if (job.receivedAt && daysBetween(job.receivedAt.slice(0,10), todayStr()) <= 7 && !paymentsOf(job).length) { S.usage = S.usage.filter(u => u.jobId !== job.id); toast('Cancelled; the $1 for this job was voided', 'ok'); } else toast('Cancelled', 'ok'); render(); } },
  'on-behalf'(form){ const job = byId('jobs', form.dataset.id); const q = currentQuote(job); const fd = new FormData(form); const approve = form.dataset.decision === 'approve'; closeSheet(); decideQuote(job, q, approve, 'shop_on_behalf', `${approve ? 'Approved' : 'Declined'} ${fd.get('via')}${fd.get('note') ? ': ' + fd.get('note') : ''}`); toast(`${approve ? 'Approval' : 'Decline'} recorded`, 'ok'); render(); },
  'customer-decline'(form){ const job = byId('jobs', form.dataset.id); const q = currentQuote(job); const note = new FormData(form).get('note').toString().trim(); closeSheet(); decideQuote(job, q, false, 'token_page', note); toast('Declined. The shop will get it back to you.'); render(); },
  customer(form){ const c = byId('customers', form.dataset.id); const fd = new FormData(form); c.first = fd.get('first').toString().trim(); c.last = fd.get('last').toString().trim(); c.phone = fd.get('phone').toString().trim(); c.email = fd.get('email').toString().trim(); c.notes = fd.get('notes').toString(); toast('Saved', 'ok'); render(); },
  'shop-profile'(form){ const fd = new FormData(form); for (const k of ['name','phone','email','city','hours','mailAddress','dropOff']) S.shop[k] = fd.get(k).toString(); toast('Profile saved', 'ok'); render(); },
  'shop-policies'(form){ const fd = new FormData(form); S.shop.depositPolicy = fd.get('depositPolicy').toString(); S.shop.uncollectedPolicy = fd.get('uncollectedPolicy').toString(); S.shop.uncollectedDays = Math.min(365, Math.max(7, parseInt(fd.get('uncollectedDays')) || 90)); S.shop.returnShippingCents = Math.round(parseFloat(fd.get('returnShipping')) * 100) || 0; toast('Policies saved', 'ok'); render(); },
  'closed-until'(form){ const fd = new FormData(form); S.shop.closedUntil = fd.get('closedUntil'); S.shop.closedMessage = fd.get('closedMessage').toString(); toast(`Page shows "Closed until ${fmtDate(S.shop.closedUntil)}"`, 'ok'); render(); },
  'page-text'(form){ const fd = new FormData(form); S.shop.headline = fd.get('headline').toString(); S.shop.intro = fd.get('intro').toString(); S.shop.acceptsMailIn = !!fd.get('acceptsMailIn'); S.shop.acceptsDropOff = !!fd.get('acceptsDropOff'); toast('Saved', 'ok'); render(); },
  'delete-shop'(form){ const slug = new FormData(form).get('slug').toString().trim(); if (slug !== S.shop.slug) { toast('The slug doesn\'t match'); return; } S.ui.deleted = addDays(todayStr(), 30); closeSheet(); toast('Deletion scheduled in 30 days'); render(); },
};

const CHANGES = {
  'req-kind'(el){ const kind = el.value; const sel = $('#rq-service'); sel.innerHTML = S.services.filter(s => s.active && !s.isEstimateFee && s.kind === kind && s.turnaroundDays > 0).map(s => `<option value="${s.id}">${esc(s.name)} — ${svcPrice(s)}${depositFor(s) ? `, ${money(depositFor(s))} deposit` : ''}</option>`).join(''); $('#rq-problem-l').textContent = kind === 'rod' ? 'What do you want built or fixed?' : "What's it doing?"; $('#rq-submit').textContent = kind === 'rod' ? 'Place the order' : 'Send the request'; updateRequestServiceHint(); },
  'req-service'(){ updateRequestServiceHint(); },
  'nj-kind'(el){ const sel = $('#nj-service'); sel.innerHTML = njServiceOptions(el.value); delete $('#nj-promised').dataset.dirty; delete $('#nj-price').dataset.dirty; njUpdateServiceHint(); },
  'nj-service'(){ delete $('#nj-promised').dataset.dirty; delete $('#nj-price').dataset.dirty; njUpdateServiceHint(); },
  'nj-promised-dirty'(el){ el.dataset.dirty = '1'; },
  'nj-deposit'(el){ $('#nj-deposit-method').hidden = el.value === 'none'; },
  'nj-photo'(el){ const name = el.files?.[0]?.name || `Intake photo ${S.ui.nj.photos.length + 1}`; S.ui.nj.photos.push(name); $('#nj-photos').insertAdjacentHTML('beforeend', photoTile({ kind: 'intake', caption: name, hue: '#4a6a8a', customerVisible: true })); $('#nj-photo-msg').textContent = `${S.ui.nj.photos.length} photo${S.ui.nj.photos.length > 1 ? 's' : ''} queued (resized on the phone).`; },
  'job-photo'(el){ const job = byId('jobs', el.dataset.id); const name = el.files?.[0]?.name || 'Bench photo'; addPhoto(job, job.status === 'ready' || job.status === 'finishing' ? 'finished' : job.receivedAt ? 'progress' : 'intake', name.replace(/\.[a-z0-9]+$/i, ''), false); toast('Photo added (hidden from the customer until you switch it on)', 'ok'); render(); },
  'photo-vis'(el){ const p = byId('photos', el.dataset.id); p.customerVisible = el.checked; toast(el.checked ? 'Visible on the status page' : 'Hidden from the customer'); },
  'quote-note'(el){ const dq = draftQuote(byId('jobs', el.dataset.id)); if (dq) dq.note = el.value; },
  'quote-expiry'(el){ const dq = draftQuote(byId('jobs', el.dataset.id)); if (dq) dq.expiresDays = +el.value; },
  'close-how'(el){ $('#ship-fields').hidden = el.value !== 'shipped'; },
  passfee(el){ S.shop.passFee = el.checked; toast(el.checked ? 'Online payments now add a $1.00 service fee line' : 'Pass-the-fee off', 'ok'); },
  publish(el){ S.shop.published = el.checked; toast(el.checked ? 'Page is live' : 'Page unpublished', 'ok'); render(); },
  'closed-toggle'(el){ if (el.checked) { $('#closed-form').hidden = false; $('#cu-date')?.focus(); } else { S.shop.closedUntil = null; toast('Page shows you as open', 'ok'); render(); } },
};
const INPUTS = {
  'jobs-q'(el){ S.ui.jobsFilter.q = el.value; $('#jobs-list').innerHTML = jobsListHtml(); },
  'cust-q'(el){ const list = el.value.trim() ? custMatches(el.value) : S.customers.slice(); $('#cust-list').innerHTML = custListHtml(list); },
  'nj-cust-q'(el){ const list = custMatches(el.value).slice(0, 6); $('#nj-cust-results').innerHTML = list.map(c => { const s = custSummary(c); return `<button type="button" class="btn" data-act="nj-pick" data-cid="${c.id}"><span class="ch"><span>${esc(custName(c))}</span><small>${esc(c.phone)} · ${esc(c.email)} · ${s.jobs.length} job${s.jobs.length === 1 ? '' : 's'}</small></span></button>`; }).join('') + (el.value.trim() && !list.length ? `<p class="small muted">No one on file; fill in the new-customer fields below.</p>` : ''); },
};

// ===================================================================================
// Wiring
// ===================================================================================
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('submit', (e) => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (!el) return; const fn = CHANGES[el.dataset.change]; if (fn) fn(el); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (!el) return; const fn = INPUTS[el.dataset.input]; if (fn) fn(el); });
for (const id of ['sheet','checkout']) { const d = document.getElementById(id); d.addEventListener('click', (e) => { if (e.target === d) { if (id === 'checkout') ACTIONS['co-cancel'](); else closeSheet(); } }); d.addEventListener('cancel', (e) => { e.preventDefault(); if (id === 'checkout') ACTIONS['co-cancel'](); else closeSheet(); }); }
window.addEventListener('hashchange', render);
seed();
if (!location.hash) history.replaceState(null, '', '#/');
render();
// expose for the verification script only
window.__bt = { get S(){ return S; }, balance, monthUsage, jobByNumber, todayStr };
</script>
